dataset:
  root: data/raw/SKAB/data
  reference_rows: 400        # anomaly-free reference (same as baseline)
  train_rows: 300            # rows [0,300) train, rows [300,400) validation
  exclude_files: [other/2.csv]

windowing:
  window_size: 32            # model-artifact dependent (must be divisible by 4)
  stride: 1

preprocessing:
  normalization_method: zscore

model:                       # all model-artifact dependent
  latent_dim: 16
  filter_count: 16
  kernel_size: 5

training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.001
  patience: 10
  threshold_percentile: 99.0

detector:
  name: conv_ae
  threshold: null            # null -> derived from validation errors; hot-swappable later

output:
  metrics_dir: reports/metrics
  model_dir: models/conv_ae_v1

seed: 0

compression:                 # offline TFLite conversion (Iteration 3)
  calibration_samples: 500   # INT8 representative windows, drawn from anomaly-free TRAIN windows
  max_metric_change: 0.03    # acceptance: |delta| of F1, FAR, MAR vs FP32 Keras
  max_auc_drop: 0.02         # acceptance: ROC-AUC decrease vs FP32 Keras
  wide_calibration_max_amplitude: 4.0   # 'wide' INT8 variant: extra calibration windows scaled by U(1, k)
